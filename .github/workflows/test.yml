name: test

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.9", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Unit + end-to-end tests (fake workers)
        shell: bash
        run: python -m unittest discover -s tests -v 2>&1 | tee test.log; exit ${PIPESTATUS[0]}
      - name: Report failures as annotations
        if: failure()
        shell: bash
        run: python tests/annotate.py test.log
      - name: CLI smoke test
        run: python skills/boss/scripts/orch.py --version

  validate-plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install -g @anthropic-ai/claude-code
      - run: claude plugin validate .
